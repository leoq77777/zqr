[project]
name = "quant-research"
version = "0.1.0"
description = "Quant Research Agent: Coinbase data pipeline, deterministic backtests, validation, agent controller and paper trading"
authors = [
    { name = "leoq77777", email = "njuleoqin@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.28.1",
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "mcp>=1.20",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "websockets>=17.2",
]

[project.scripts]
zqr = "quant_research.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: hits real public APIs (deselect with -m 'not network')"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
